<style>
@page {
    size: 3in 2in;
    margin: 0;
}

html, body {
    width: 3in;
    height: 2in;
    margin: 0 !important;
    padding: 0 !important;
}

.print-format {
    width: 3in;
    height: 2in;
}

.label-container {
    width: 3in;
    height: 2in;
    border: 1px solid black;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

td {
    width: 50%;
    border: 1px solid black;
    padding: 0px;
    font-size: 8px;
    line-height: 10px;
    height: 16px;
}


.title {
    font-size: 11px;
    font-weight: bold;
}

.batch {
    font-size: 10px;
    font-weight: bold;
}

.logo img {
    max-height: 25px;
    width: 100%;
    object-fit: contain;
}
</style>


<div class="">

    <table class="label-container">

        <!-- Logo -->
        <tr>
            <td colspan="2" class="logo" style="width:100%; background:black; text-align:center; padding:6px;">
                <img src="https://scentedslogan.m.frappe.cloud/files/ScentedSlogan2.png">
            </td>
        </tr>

        <!-- Item Name -->
        <tr>
            <td colspan="2" class="title" style="text-align: center;">
                {{ doc.item_name }}
            </td>
        </tr>

        <!-- SO and FG -->
        <tr>
            <td style="text-align: center;">
                SO-{{ doc.name }}
            </td>
            <td style="text-align: left;">
                &nbsp;&nbsp;FG :
            </td>
        </tr>

        <!-- Number Rows -->
        <tr>
            <td style="text-align: left;">1.</td>
            <td style="text-align: left;">5.</td>
        </tr>
        <tr>
            <td style="text-align: left;">2.</td>
            <td style="text-align: left;">6.</td>
        </tr>
        <tr>
            <td style="text-align: left;">3.</td>
            <td style="text-align: left;">7.</td>
            
        </tr>
        <tr>
            <td style="text-align: left;">4.</td>
            <td style="text-align: left;">8.</td>
        </tr>

        <!-- Batch -->
        <tr>
            <td colspan="2" class="batch" style="text-align: center;">
                Batch No.: 
            </td>
        </tr>

    </table>

</div>
